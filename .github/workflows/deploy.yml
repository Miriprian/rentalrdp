name: 🚀 Deploy otomatis ke VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Info (tanpa menampilkan isi rahasia)
        run: echo "Mode deploy: $(if [ -n "$VPS_HOST" ]; then echo 'AKTIF (VPS_HOST terisi)'; else echo 'NONAKTIF (VPS_HOST belum diisi — pakai ./update.sh manual di VPS)'; fi)"

      - name: 🚀 SSH ke VPS + update otomatis
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/rentalrdp.com || { echo "Folder belum ada (jalankan install.sh dulu)"; exit 1; }
            git pull --ff-only || exit 1
            bash ./update.sh || exit 1