<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dashboard — rentalrdp.com</title>
<meta name="description" content="Dashboard penyewa rentalrdp.com — pesanan, RDP, akun."/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/theme.css"/>
<script>try{var t=localStorage.getItem("theme")||"system";var r=t==="dark"?"dark":t==="light"?"light":(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",r)}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>"/>
<style>
  body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto}
  .card{background:#0f172a;border:1px solid #1e293b}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<header class="sticky top-0 z-40 bg-slate-950/90 backdrop-blur border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
    <a href="/" class="text-2xl" title="Beranda">🖥️</a>
    <div>
      <div class="font-extrabold text-lg leading-none">rentalrdp<span class="text-emerald-400">.com</span></div>
      <div class="text-[11px] text-slate-400">Dashboard Penyewa</div>
    </div>
    <nav class="ml-auto flex items-center gap-2 text-sm">
      <select id="themeSel" class="px-2 py-2 rounded-lg bg-slate-800 border border-slate-700 text-xs" title="Mode tampilan">
        <option value="system">🖥️ System</option>
        <option value="light">☀️ Light</option>
        <option value="dark">🌙 Dark</option>
      </select>
      <a href="/" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700">← Katalog</a>
      <a id="btnAdminLink" href="/admin" class="hidden px-3 py-2 rounded-lg bg-amber-700 hover:bg-amber-600 font-bold">Admin</a>
      <span id="navUser" class="hidden md:inline text-slate-300 text-xs"></span>
      <button id="btnLogout" class="hidden px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700">Keluar</button>
    </nav>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-8" id="dashWrap">
  <h1 class="text-2xl font-extrabold mb-1">Dashboard Saya</h1>
  <div id="dashRole" class="text-xs text-slate-400 mb-2"></div>
  <div id="adminHint" class="hidden text-xs mb-4 px-4 py-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200">Kamu login sebagai admin — kelola sistem di <a href="/admin" class="underline font-bold">/admin →</a></div>
  <div class="flex flex-wrap gap-2 mb-4 text-sm" id="dashTabs"></div>
  <div id="dashBody"></div>
</main>

<footer class="border-t border-slate-800 mt-10">
  <div class="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-400 flex flex-wrap gap-2">
    <span>© 2026 rentalrdp.com — Bare metal rental.</span>
    <span class="ml-auto"><a class="underline" href="/">Beranda</a> • <a class="underline" href="/admin">Admin</a></span>
  </div>
</footer>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm shadow-2xl"></div>
<script src="/js/common.js"></script>
<script src="/js/user.js"></script>
</body>
</html>
